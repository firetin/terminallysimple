[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "terminallysimple"
version = "0.2.0"
description = "One terminal app. All your essential tools. Zero distractions."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "firetin", email = "porttek0@gmail.com" }]
maintainers = [{ name = "firetin", email = "porttek0@gmail.com" }]
keywords = ["terminal", "tui", "textual", "editor", "tasks", "pomodoro", "productivity"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Editors",
    "Topic :: Utilities",
    "Typing :: Typed",
]
dependencies = [
    "textual>=0.86,<9",
    "httpx>=0.27,<1",
    "psutil>=5.9",
    "platformdirs>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.7",
]

[project.urls]
Homepage = "https://github.com/firetin/terminallysimple"
Repository = "https://github.com/firetin/terminallysimple"
Issues = "https://github.com/firetin/terminallysimple/issues"
Changelog = "https://github.com/firetin/terminallysimple/blob/main/CHANGELOG.md"

[project.scripts]
terminallysimple = "app:main"

[tool.setuptools]
packages = ["utils", "widgets", "dialogs"]
py-modules = [
    "app",
    "base_screen",
    "config",
    "constants",
    "editor",
    "services",
    "settings",
    "tasks",
]

[tool.setuptools.package-data]
widgets = ["*.tcss"]
dialogs = ["*.tcss"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312", "py313"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [".venv", "build", "dist", "notes"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
]
ignore = [
    "E501", # line length is handled by the formatter
    "B008", # function calls in argument defaults (Textual patterns)
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["S101"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true
pretty = true
files = ["."]
exclude = "(?x)(^build/|^dist/|^[.]venv/|^tests/)"

[[tool.mypy.overrides]]
module = ["textual.*", "psutil"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = ["--strict-markers", "--strict-config", "-ra"]
markers = [
    "slow: marks tests as slow",
    "integration: marks tests as integration tests",
]

[tool.coverage.run]
source = ["."]
omit = ["tests/*", ".venv/*", "setup.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
precision = 2
show_missing = true
skip_covered = false
